[fmt]
semi = true
trailingComma = "es5"
singleQuote = false
printWidth = 119
tabWidth = 2
useTabs = false
proseWrap = "preserve"
ignorePatterns = ["out/", "build/", "bun.lockb"]

[fmt.sortImports]
internalPattern = ["@/"]
groups = [
  ["type-builtin", "type-external", "value-builtin", "value-external"],
  ["type-internal", "value-internal"],
  ["type-parent", "type-sibling", "type-index", "value-parent", "value-sibling", "value-index"],
  "unknown",
]

[fmt.sortTailwindcss]
stylesheet = "./src/app/globals.css"
